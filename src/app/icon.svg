<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="stuanytt-logo-title">
  <title id="stuanytt-logo-title">Stuanytt-logo</title>

  <rect width="600" height="600" fill="#111111" />

  <!-- Flagg venstre -->
  <polygon points="55,40 235,75 235,565 90,565" fill="#ffffff" />
  <!-- Flagg høyre (speilvendt) -->
  <polygon points="545,40 365,75 365,565 510,565" fill="#ffffff" />

  <!-- ST -->
  <text x="300" y="120" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff">S</text>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff">T</text>

  <rect x="248" y="212" width="104" height="9" fill="#ffffff" />

  <!-- Avisikon -->
  <g>
    <rect x="245" y="232" width="110" height="128" rx="10" fill="none" stroke="#ffffff" stroke-width="10" />
    <rect x="262" y="250" width="34" height="34" fill="#ffffff" />
    <rect x="306" y="251" width="38" height="7" fill="#ffffff" />
    <rect x="306" y="264" width="38" height="7" fill="#ffffff" />
    <rect x="306" y="277" width="30" height="7" fill="#ffffff" />
    <rect x="262" y="298" width="82" height="7" fill="#ffffff" />
    <rect x="262" y="313" width="82" height="7" fill="#ffffff" />
    <rect x="262" y="328" width="82" height="7" fill="#ffffff" />
    <rect x="262" y="343" width="60" height="7" fill="#ffffff" />
    <circle cx="352" cy="252" r="5" fill="#ffffff" />
    <circle cx="352" cy="278" r="5" fill="#ffffff" />
    <circle cx="352" cy="304" r="5" fill="#ffffff" />
    <circle cx="352" cy="330" r="5" fill="#ffffff" />
  </g>

  <rect x="248" y="379" width="104" height="9" fill="#ffffff" />

  <!-- UA -->
  <text x="300" y="475" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff">U</text>
  <text x="300" y="560" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="90" fill="#ffffff">A</text>
</svg>
